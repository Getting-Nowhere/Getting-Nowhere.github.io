<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title | upcase }}</a>

    <nav class="nav" id="nav" aria-label="Primary">
      {% for item in site.data.nav %}
        {% assign is_active = false %}
        {% if page.url == item.url %}{% assign is_active = true %}{% endif %}
        {% if item.url == '/' and page.layout == 'post' %}{% assign is_active = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if is_active %} class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
      {% endfor %}
    </nav>

    <button class="menu-btn" type="button" aria-expanded="false" aria-controls="nav">MENU</button>
  </div>
</header>
